# Render 一键部署蓝图（Blueprint）
# 用法：登录 render.com → New → Blueprint → 选择这个仓库 → Apply
# 标记 sync:false 的变量需要在 Render 控制台手动填写（值从本地 .env 复制）
#
# Phase 0：数据库是唯一权威源，飞书两个 Base 退化为同步副本。
# 首次部署这个 Blueprint 后，需要手动跑一次（Render Shell 或本地对着这个数据库跑）：
#   npm run db:migrate   建表
#   npm run db:seed      导入 P1 物料/供应商快照 + 供应商排班（需要先本地跑
#                        server/db/seed/export_p1.py 生成 data/*.json，这些文件
#                        含业务数据不进 git，见 .gitignore 里的说明）
services:
  - type: web
    name: haidilao-receiving-app
    runtime: node
    plan: free
    region: singapore
    # --include=dev 是关键：NODE_ENV=production 会让 npm install 默认跳过
    # devDependencies，但 vite/typescript 等构建工具都在 devDependencies 里，
    # 不加这个 build 会报 "vite: not found"。
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Cookie 签名密钥：由 Render 自动生成随机值，无需手填
      - key: SESSION_SECRET
        generateValue: true
      # 部署完成后把它改成 https://<你的服务>.onrender.com/api/auth/callback
      # 并在飞书开放平台把同一地址加入「重定向 URL」白名单
      - key: FEISHU_REDIRECT_URI
        sync: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      # 登录成功后跳回前端地址；生产环境留空即可（默认跳回 "/"）
      - key: FRONTEND_URL
        sync: false
      - key: FEISHU_SUPPLIER_APP_TOKEN
        sync: false
      - key: FEISHU_SUPPLIER_TABLE_ID
        sync: false
      - key: FEISHU_RECEIVING_APP_TOKEN
        sync: false
      - key: FEISHU_RECEIVING_TABLE_ID
        sync: false
      # 数据库连接串：Render 会自动从下面 databases 里的实例注入，不用手填
      - key: DATABASE_URL
        fromDatabase:
          name: haidilao-receiving-db
          property: connectionString

databases:
  - name: haidilao-receiving-db
    databaseName: haidilao_receiving_db
    plan: 0.1c-256mb
    region: singapore
